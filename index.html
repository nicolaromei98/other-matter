<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Other Matter — A catalogue of matter that does not yet exist</title>
    <meta name="description" content="An interactive archive of six impossible materials, rendered live: Aerogel Skin, Memory Glass, Thermal Foam, Dust Silk, Liquid Stone and Bio Lens." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* First paint, before the app's stylesheet arrives: only the loader curtain shows. */
      html, body { margin: 0; background: #fff; }
      .loader { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 14px; background: #fff; }
      .loader > * { opacity: 0; }
    </style>
  </head>
  <body>
    <div class="om" data-mode="grid">
      <header class="om-head">
        <div class="om-row">
          <h1 class="om-title"><span class="ln"><span>A catalogue of matter</span></span><span class="ln"><span>that does not yet exist.</span></span></h1>
          <svg class="om-logo" width="28" height="28" viewBox="0 0 32 32" role="img" aria-label="Other Matter"><rect width="32" height="32" rx="5" fill="#f2f1ee" /><ellipse cx="16" cy="16" rx="10" ry="6.5" fill="none" stroke="#131312" stroke-width="1.4" /><circle cx="16" cy="16" r="1.6" fill="#131312" /></svg>
          <div class="om-switch">
            <span class="om-label om-view" aria-hidden="true"><span>VIEW —&nbsp;</span><span class="om-view-v">GRID</span></span>
            <div class="sw-track" role="radiogroup" aria-label="View">
              <span class="sw-thumb" aria-hidden="true"></span>
              <button class="sw" type="button" role="radio" data-mode="gallery" aria-checked="false" tabindex="-1" aria-label="Gallery view">
                <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="33" y="26" width="34" height="49" rx="8" /><path d="M20 32v37M80 32v37" /></svg>
              </button>
              <button class="sw" type="button" role="radio" data-mode="grid" aria-checked="true" tabindex="0" aria-label="Grid view">
                <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="23" y="23" width="17.5" height="17.5" rx="5" /><rect x="55" y="23" width="17.5" height="17.5" rx="5" /><rect x="23" y="55" width="17.5" height="17.5" rx="5" /><rect x="55" y="55" width="17.5" height="17.5" rx="5" /></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="om-rulebox">
          <span class="om-rule" aria-hidden="true"></span>
          <div class="om-row">
            <span class="om-label">INDEX — SPECIMENS 01–06</span>
            <span class="om-row om-sub-right">
              <button class="om-label om-sound" type="button" aria-pressed="true" aria-label="Sound"><span aria-hidden="true">SOUND —&nbsp;</span><span class="om-sound-v" aria-hidden="true">ON</span></button>
              <span class="om-label">RENDERED LIVE · WEBGL</span>
            </span>
          </div>
        </div>
      </header>

      <section class="om-stage">
        <div class="gallery" aria-label="Gallery">
          <div class="g-name"><p class="om-label g-code" aria-hidden="true"></p><p class="g-title"></p></div>
          <div class="g-stage" role="img"></div>
          <div class="g-desc">
            <p class="g-short"></p>
            <button class="g-inspect" type="button">
              <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4.6" /><path d="M8 1.2v3M8 11.8v3M1.2 8h3M11.8 8h3" /></svg>
              <span class="om-label">INSPECT SPECIMEN</span>
            </button>
            <button class="om-label g-scan" type="button">SCAN SPECIMEN</button>
          </div>
          <nav class="g-nav" aria-label="Specimens">
            <div class="g-pill">
              <div class="g-dots"></div>
              <button class="g-prev" type="button" aria-label="Previous specimen"></button>
              <button class="g-next" type="button" aria-label="Next specimen"></button>
            </div>
          </nav>
        </div>
        <div class="grid" aria-label="Archive grid"></div>
      </section>
    </div>

    <canvas class="gl" aria-hidden="true"></canvas>
    <div class="hud" hidden></div>

    <div class="loader" role="status" aria-live="polite">
      <span class="om-label">OTHER MATTER® — PREPARING SPECIMENS <span class="loader-count">0/6</span></span>
      <span class="loader-bar"><i></i></span>
    </div>

    <noscript><p style="padding:24px;font-family:sans-serif">Other Matter needs JavaScript to grow its specimens.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
